name: Physical acceptance (explicit infrastructure required)

# Never schedule PR/fork code on self-hosted infrastructure.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redstone-physical-acceptance
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  admission:
    name: Verify physical infrastructure admission
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require administrator-authorized disposable infrastructure
        env:
          READY: ${{ vars.RC_PHYSICAL_RUNNER_READY }}
          REQUESTED_REF: ${{ github.ref }}
        run: |
          if [[ "$READY" != ephemeral-v1 || "$REQUESTED_REF" != 'refs/heads/Router-Refactor(R10-N5)' ]]; then
            echo '::error::Physical acceptance is unavailable. Follow Docs/Testing/ContinuousIntegration.md; provision and authorize an isolated ephemeral runner, protected environment, and prior EULA setup. Dispatch only the reviewed Router integration ref.'
            exit 1
          fi

  fast-checks:
    needs: admission
    uses: ./.github/workflows/deterministic.yml

  physical:
    name: Seven-case physical acceptance
    needs: [admission, fast-checks]
    environment: physical-acceptance
    runs-on:
      group: redstone-physical
      labels: [self-hosted, linux, x64, redstone-fabric-ephemeral]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '25.0.4.1+1'
      - name: Prepare isolated pinned build tools
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup override set 1.96.0
          python -m venv .venv
          .venv/bin/python -m pip install --only-binary=:all: --require-hashes -r Tools/CI/requirements.txt
      - name: Run existing expanded physical acceptance with provenance checks
        run: |
          source .venv/bin/activate
          python Tools/CI/RunChecks.py --tier physical --expected-commit "$GITHUB_SHA" --output Output/CI/physical
      - name: Retain incomplete setup receipt
        if: always()
        run: |
          if [[ ! -f Output/CI/physical/Run.json ]]; then
            mkdir -p Output/CI/physical
            printf '{"Status":"incomplete","Failure":"Setup did not produce a run receipt","ExpectedCommit":"%s"}\n' "$GITHUB_SHA" > Output/CI/physical/Bootstrap.json
          fi
      - name: Publish the allowlisted evidence subset
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: physical-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: Output/CI/physical/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 7
